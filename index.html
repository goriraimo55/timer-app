<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#12479;&#12502;&#12524;&#12483;&#12488;&#12479;&#12452;&#12510;&#12540;</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="timer app">
    <section class="preset-panel" aria-label="preset time">
      <h1>Timer</h1>
      <div class="preset-buttons">
        <button class="preset-button" data-minutes="1">1&#20998;</button>
        <button class="preset-button" data-minutes="3">3&#20998;</button>
        <button class="preset-button" data-minutes="5">5&#20998;</button>
        <button class="preset-button" data-minutes="10">10&#20998;</button>
        <button class="preset-button" data-minutes="15">15&#20998;</button>
        <button class="preset-button" data-minutes="30">30&#20998;</button>
        <button class="preset-button" data-minutes="60">60&#20998;</button>
      </div>
    </section>

    <section class="timer-panel" aria-label="timer controls">
      <div id="timerDisplay" class="timer-display" aria-live="polite">00:00</div>

      <div class="control-buttons">
        <button id="startButton" class="control-button start-button">START</button>
        <button id="stopButton" class="control-button stop-button">STOP</button>
        <button id="resetButton" class="control-button reset-button">RESET</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
